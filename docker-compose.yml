services:
  api:
    # image: bogie-api:latest
    build: ./Bogie-Api
    volumes:
      - ./Bogie-Api:/var/www/html:cached
    ports:
      - "8000:8000"
  database:
    build: ./Bogie-Database
    env_file:
      - .env
    volumes:
      - db_data:/var/lib/postgresql/
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -h localhost -p $POSTGRES_PORT"]
      interval: 10s
      timeout: 5s
      retries: 5
  etl:
    build: ./Bogie-ETL
    env_file:
      - .env
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ./Bogie-ETL:/app:cached
volumes:
  db_data:
      